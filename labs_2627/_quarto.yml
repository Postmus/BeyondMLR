project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - BLR_lab_*.qmd
    - assignments/**/assignment.qmd
    - "!assignments/**/downloads/**"
  resources:
    - data/*.csv
    - assignments/**/downloads/*.csv
    - assignments/**/downloads/*.qmd

website:
  title: "Beyond MLR · 2026–2027"
  navbar:
    background: "#0C5964"
    foreground: white
    left:
      - text: Week 1
        menu:
          - text: "Lab 1: Center as a fixed effect"
            href: BLR_lab_center_fixed.qmd
          - text: "Lab 2: Center as a random effect"
            href: BLR_lab_center_random.qmd
          - text: "Assignment: Protein extraction protocols"
            href: assignments/week1/assignment.qmd
      - text: Week 2
        menu:
          - text: "Lab 3: Treatment effects across laboratories"
            href: BLR_lab_fixed_interaction.qmd
          - text: "Lab 4: Random intercepts and treatment slopes"
            href: BLR_lab_random_interaction.qmd
          - text: "Assignment: Postoperative pain management"
            href: assignments/week2/assignment.qmd
      - text: Lab answers
        menu:
          - text: "Week 1 · Lab 1: Center as a fixed effect"
            href: BLR_lab_center_fixed_answers.qmd
          - text: "Week 1 · Lab 2: Center as a random effect"
            href: BLR_lab_center_random_answers.qmd
  search: true

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    embed-resources: true
